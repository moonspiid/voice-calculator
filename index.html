<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#07080c">
<meta name="color-scheme" content="dark">
<meta name="description" content="Calculatrice mobile vocale : dictez le calcul, le résultat s'affiche puis tout se réinitialise.">
<title>Calculatrice vocale</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='15'%20fill='%23ff8a3d'/%3E%3Crect%20x='13'%20y='13'%20width='38'%20height='12'%20rx='4'%20fill='%23140a03'/%3E%3Cg%20fill='%23140a03'%3E%3Ccircle%20cx='21'%20cy='34'%20r='4.2'/%3E%3Ccircle%20cx='32'%20cy='34'%20r='4.2'/%3E%3Ccircle%20cx='43'%20cy='34'%20r='4.2'/%3E%3Ccircle%20cx='21'%20cy='47'%20r='4.2'/%3E%3Ccircle%20cx='32'%20cy='47'%20r='4.2'/%3E%3Ccircle%20cx='43'%20cy='47'%20r='4.2'/%3E%3C/g%3E%3C/svg%3E">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{--bg:#07080c;--accent:#ffb26b;--op:#ff8a3d;--text:#f4f6ff;--muted:#7b819b}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;display:grid;place-items:center;overflow:hidden;color:var(--text);
    background:radial-gradient(85% 55% at 50% -8%,rgba(255,138,61,.2),transparent 68%),radial-gradient(120% 90% at 50% 110%,#12151f 0%,var(--bg) 62%);
    font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  .app{position:relative;width:min(100vw,420px);height:min(calc(100dvh - 20px),900px);display:flex;flex-direction:column;overflow:hidden;
    background:linear-gradient(180deg,#151925 0%,#0b0d13 58%);border:1px solid rgba(255,255,255,.07);border-radius:32px;
    box-shadow:0 40px 90px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.06)}
  @media (max-width:440px){.app{width:100vw;height:100dvh;border:0;border-radius:0;box-shadow:none}}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 18px 8px}
  .brand{display:flex;align-items:center;gap:9px;min-width:0}
  .logo{display:block;width:24px;height:24px;border-radius:8px;flex:0 0 auto;filter:drop-shadow(0 4px 10px rgba(255,138,61,.45))}
  .brandText{display:flex;flex-direction:column;line-height:1.06;min-width:0}
  .brandText b{font-size:13px;font-weight:600;letter-spacing:.01em}
  .brandText small{font-size:9px;font-weight:600;color:var(--muted);letter-spacing:.16em;text-transform:uppercase}
  .tools{display:flex;align-items:center;gap:7px;flex:0 0 auto}
  .badge{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--muted);padding:4px 9px;border-radius:999px;
    border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.02)}
  .dot{width:6px;height:6px;border-radius:50%;background:#4b5062;transition:background .2s,box-shadow .2s}
  .badge.on .dot{background:#43d17c;box-shadow:0 0 10px #43d17c}
  .badge.listen .dot{background:var(--op);box-shadow:0 0 12px var(--op);animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.25}}

  /* ---------- Hologramme vocal ---------- */
  .holo{flex:0 0 auto;position:relative;display:grid;place-items:center;height:clamp(64px,17vw,92px);margin:2px 0 0}
  .holoCore{position:relative;width:clamp(50px,14vw,72px);height:clamp(50px,14vw,72px);border-radius:50%;display:grid;place-items:center;
    background:radial-gradient(circle at 50% 42%,rgba(255,196,150,.6),rgba(255,122,40,.2) 58%,rgba(255,122,40,0) 76%);
    box-shadow:0 0 calc(12px + var(--level,0) * 44px) rgba(255,138,61,.5),inset 0 0 22px rgba(255,178,107,.3);
    animation:breathe 3.6s ease-in-out infinite;transition:box-shadow .22s ease}
  .holoRing{position:absolute;width:clamp(62px,17vw,90px);height:clamp(62px,17vw,90px);border-radius:50%;
    background:conic-gradient(from 0deg,transparent 0deg,rgba(255,178,107,.9) 70deg,transparent 170deg);
    -webkit-mask:radial-gradient(closest-side,transparent 78%,#000 80%);
    mask:radial-gradient(closest-side,transparent 78%,#000 80%);
    animation:spin 7s linear infinite;opacity:calc(.32 + var(--level,0) * .6)}
  .holoRing.b{width:clamp(52px,14vw,74px);height:clamp(52px,14vw,74px);animation-direction:reverse;animation-duration:5.2s;
    opacity:calc(.2 + var(--level,0) * .5)}
  .holo.live .holoRing{animation-duration:1.1s}
  .holo.live .holoRing.b{animation-duration:.8s}
  .holo.live .holoCore{animation-duration:1.5s}
  .holoBars{display:flex;align-items:center;gap:3px;height:calc(16px + var(--level,0) * 26px);transition:height .12s linear}
  .holoBars i{width:3px;border-radius:2px;background:linear-gradient(180deg,#ffe6cf,#ff8a3d);
    height:calc(var(--k,1) * (22% + var(--level,0) * 78%));opacity:calc(.5 + var(--level,0) * .5);
    transition:height .12s linear,opacity .2s ease}
  .holoBars i:nth-child(1){--k:.55}
  .holoBars i:nth-child(2){--k:.92}
  .holoBars i:nth-child(3){--k:1}
  .holoBars i:nth-child(4){--k:.78}
  .holoBars i:nth-child(5){--k:.5}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

  .display{flex:1 1 auto;min-height:80px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;
    padding:6px 20px 14px;overflow:hidden}
  .history{font-size:clamp(12px,3.6vw,15px);color:var(--muted);min-height:20px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .result{font-size:clamp(46px,16vw,84px);font-weight:300;line-height:1.02;letter-spacing:-.035em;max-width:100%;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums;text-shadow:0 8px 26px rgba(0,0,0,.5)}
  .transcript{font-size:clamp(10px,3vw,12px);color:#5b6180;min-height:15px;max-width:100%;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-style:italic}
  .keypad{flex:1.45 1 0;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(5,1fr);
    gap:clamp(7px,2vw,12px);padding:0 clamp(12px,4vw,20px)}
  .key{display:grid;place-items:center;min-width:0;min-height:0;border:1px solid rgba(255,255,255,.055);border-radius:clamp(16px,4.4vw,22px);
    background:linear-gradient(180deg,#1d2130,#12151d);color:var(--text);font:inherit;font-size:clamp(18px,5.4vw,25px);font-weight:500;
    cursor:pointer;user-select:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 8px 16px rgba(0,0,0,.35);
    transition:transform .07s ease,filter .12s ease}
  .key:active{transform:scale(.96);filter:brightness(1.3)}
  .key.fn{background:linear-gradient(180deg,#272c3b,#1b2029);color:var(--accent);font-weight:600;font-size:clamp(15px,4.4vw,19px)}
  .key.op{background:linear-gradient(180deg,#ffa055,#f2761f);border-color:rgba(255,196,150,.4);color:#231304;font-weight:700;
    font-size:clamp(20px,6vw,28px);box-shadow:0 10px 20px rgba(242,118,31,.3),inset 0 1px 0 rgba(255,255,255,.4)}
  .key.eq{background:linear-gradient(180deg,#ffbd80,#ff7a28);border-color:rgba(255,220,190,.5);color:#231304;font-weight:800;
    box-shadow:0 12px 26px rgba(255,122,40,.38),inset 0 1px 0 rgba(255,255,255,.5)}
  .voice{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:8px;
    padding:12px 20px calc(12px + env(safe-area-inset-bottom));border-top:1px solid rgba(255,255,255,.05);
    background:linear-gradient(180deg,rgba(255,255,255,.025),transparent)}
  .install{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,178,107,.25);border-radius:999px;cursor:pointer;
    padding:6px 13px;background:rgba(255,178,107,.08);color:var(--accent);font:inherit;font-size:clamp(11px,3vw,12px);font-weight:600}
  .install svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .install[hidden]{display:none}
  .mic{position:relative;width:74px;height:74px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;
    background:radial-gradient(120% 120% at 32% 18%,#ffb178,#f2691a 72%);
    box-shadow:0 16px 34px rgba(242,105,26,.42),inset 0 1px 0 rgba(255,255,255,.42);transition:transform .1s ease,box-shadow .2s ease}
  .mic:active{transform:scale(.94)}
  .mic svg{width:32px;height:32px;fill:#241307}
  .mic::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid rgba(255,138,61,.55);opacity:0;pointer-events:none}
  .mic.listening{background:radial-gradient(120% 120% at 32% 18%,#ff7b7b,#d92a2a)}
  .mic.listening::after{opacity:1;animation:pulse 1.5s ease-out infinite}
  @keyframes pulse{0%{transform:scale(1);opacity:.85}100%{transform:scale(1.45);opacity:0}}
  .hint{margin:0;font-size:clamp(10px,2.9vw,12px);color:var(--muted);text-align:center;line-height:1.35;max-width:300px}
  .legal{margin:0;display:flex;align-items:center;justify-content:center;gap:6px;font-size:clamp(9px,2.6vw,11px);color:#3f4457}
  .legal a,.legal button{border:0;background:none;padding:0;font:inherit;color:#7b819b;text-decoration:none;cursor:pointer}
  .legal a:active,.legal button:active{color:var(--accent)}
  .legal .sep{color:#33384a}
  .legal .ver{color:#33384a}
  dialog.donate{margin:auto;padding:18px;border:1px solid #232838;border-radius:22px;max-width:min(92vw,320px);background:#0e1016;
    color:var(--text);font-family:inherit;box-shadow:0 30px 80px rgba(0,0,0,.7)}
  dialog.donate::backdrop{background:rgba(4,5,9,.75)}
  dialog.donate h2{margin:0 0 4px;font-size:15px;font-weight:600}
  dialog.donate p{margin:0 0 12px;font-size:12px;color:var(--muted);line-height:1.45}
  dialog.donate code{display:block;word-break:break-all;padding:10px;border-radius:12px;background:#08090d;border:1px solid #232838;font-size:11px;line-height:1.5;color:var(--accent)}
  dialog.donate .row{display:flex;gap:8px;margin-top:12px}
  dialog.donate .row button{flex:1;border:0;border-radius:12px;padding:10px;cursor:pointer;font:inherit;font-size:12px;font-weight:600;background:#1b2029;color:var(--accent)}
  dialog.donate .row button.primary{background:linear-gradient(180deg,#ffa24f,#ff7a28);color:#20140a}
  dialog.donate .row button:active{transform:scale(.97)}
  @media (max-height:700px){.mic{width:64px;height:64px}.mic svg{width:28px;height:28px}.display{padding-bottom:8px}.voice{gap:6px;padding-top:10px}
    .holo{height:clamp(52px,14vw,70px)}.holoCore{width:44px;height:44px}.holoRing{width:56px;height:56px}.holoRing.b{width:46px;height:46px}}
</style>
</head>
<body>
<main class="app" aria-label="Calculatrice vocale">

  <header class="topbar">
    <span class="brand">
      <img class="logo" src="icon.svg" alt="" width="24" height="24">
      <span class="brandText"><b>Calculatrice</b><small>vocale</small></span>
    </span>
    <span class="tools">
      <span class="badge" id="badge"><i class="dot"></i><span id="badgeText">Vocal prêt</span></span>
    </span>
  </header>

  <div class="holo" id="holo" aria-hidden="true">
    <div class="holoRing"></div>
    <div class="holoRing b"></div>
    <div class="holoCore"><div class="holoBars"><i></i><i></i><i></i><i></i><i></i></div></div>
  </div>

  <section class="display" aria-live="polite">
    <div class="history" id="history"></div>
    <div class="result" id="result">0</div>
    <div class="transcript" id="transcript"></div>
  </section>

  <section class="keypad">
    <button class="key fn" data-key="ac" aria-label="Tout effacer">AC</button>
    <button class="key fn" data-key="del" aria-label="Effacer le dernier chiffre">⌫</button>
    <button class="key fn" data-key="%" aria-label="Pourcentage">%</button>
    <button class="key op" data-key="/" aria-label="Diviser">÷</button>

    <button class="key" data-key="7">7</button>
    <button class="key" data-key="8">8</button>
    <button class="key" data-key="9">9</button>
    <button class="key op" data-key="*" aria-label="Multiplier">×</button>

    <button class="key" data-key="4">4</button>
    <button class="key" data-key="5">5</button>
    <button class="key" data-key="6">6</button>
    <button class="key op" data-key="-" aria-label="Soustraire">−</button>

    <button class="key" data-key="1">1</button>
    <button class="key" data-key="2">2</button>
    <button class="key" data-key="3">3</button>
    <button class="key op" data-key="+" aria-label="Additionner">+</button>

    <button class="key fn" data-key="neg" aria-label="Changer le signe">±</button>
    <button class="key" data-key="0">0</button>
    <button class="key" data-key="." aria-label="Virgule">.</button>
    <button class="key eq" data-key="=" aria-label="Résultat">=</button>
  </section>

  <section class="voice">
    <button class="install" id="install" type="button" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 3v10"/>
        <path d="m8 13 4 4 4-4"/>
        <path d="M5 18v1a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-1"/>
      </svg>
      Installer l’application
    </button>
    <button class="mic" id="mic" aria-label="Dicter un calcul">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-5a3.5 3.5 0 0 0-7 0v5A3.5 3.5 0 0 0 12 15Z"/>
        <path d="M18 11.5a1 1 0 1 0-2 0 4 4 0 0 1-8 0 1 1 0 1 0-2 0 6 6 0 0 0 5 5.92V20H8.5a1 1 0 1 0 0 2h7a1 1 0 1 0 0-2H13v-2.58A6 6 0 0 0 18 11.5Z"/>
      </svg>
    </button>
    <p class="hint" id="hint">Touchez le micro et dictez « deux plus trois fois quatre »</p>
    <p class="legal">
      <span>© 2026 moonspiid</span>
      <span class="sep">·</span>
      <a href="https://x.com/moonspiid" target="_blank" rel="noopener noreferrer">X</a>
      <span class="sep">·</span>
      <a href="https://github.com/moonspiid/voice-calculator" target="_blank" rel="noopener noreferrer">GitHub</a>
      <span class="sep">·</span>
      <button type="button" id="donateBtn">Donate</button>
      <span class="sep">·</span>
      <span class="ver">v7</span>
    </p>
  </section>

  <dialog class="donate" id="donateDialog">
    <h2>Soutenir le projet</h2>
    <p>USDT sur tous les réseaux EVM : BSC, Ethereum, Polygon, Arbitrum, Base, Optimism.</p>
    <code id="donateAddr">0xA2700896E16BE762467D458F2B45260f8FAC9F3E</code>
    <div class="row">
      <button type="button" class="primary" id="copyAddr">Copier l’adresse</button>
      <button type="button" id="closeDonate">Fermer</button>
    </div>
  </dialog>

</main>

<script>
(function () {
  "use strict";

  const resultEl     = document.getElementById("result");
  const historyEl    = document.getElementById("history");
  const transcriptEl = document.getElementById("transcript");
  const hintEl       = document.getElementById("hint");
  const badgeEl      = document.getElementById("badge");
  const badgeTextEl  = document.getElementById("badgeText");
  const micEl        = document.getElementById("mic");
  const holoEl       = document.getElementById("holo");

  /* ---------- Langue détectée automatiquement (navigateur) ---------- */
  const DETECTED = (navigator.languages && navigator.languages[0]) || navigator.language || "fr-FR";
  const REC_LANG = /^[a-zA-Z]{2,3}([-_][a-zA-Z0-9]{2,8})*$/.test(DETECTED) ? DETECTED.replace("_", "-") : "fr-FR";
  const IS_FR = /^fr/i.test(REC_LANG);

  const T = IS_FR ? {
    idle: "Vocal prêt",
    listen: "Écoute…",
    active: "Micro actif",
    hint: "Touchez le micro et dictez « deux plus trois fois quatre »",
    listening: "Je vous écoute…",
    unsupported: "Reconnaissance vocale indisponible : ouvrez cette page dans Chrome.",
    denied: "Micro refusé. Autorisez le microphone dans le navigateur.",
    noSpeech: "Aucune parole détectée. Réessayez.",
    micError: "Erreur micro. Réessayez.",
    startError: "Impossible de démarrer le micro. Réessayez.",
    notUnderstood: "Calcul non reconnu. Dictez par exemple « douze divisé par quatre ».",
    incomplete: "Calcul incomplet. Réessayez.",
    done: "Résultat affiché. Prêt pour le calcul suivant…",
    installed: "Application installée.",
    chromeInstall: "Dans Chrome : menu ⋮ puis « Installer l’application ».",
    installLabel: "Installer l’application"
  } : {
    idle: "Voice ready",
    listen: "Listening…",
    active: "Mic active",
    hint: "Tap the mic and say “two plus three times four”",
    listening: "Listening…",
    unsupported: "Speech recognition is unavailable: open this page in Chrome.",
    denied: "Microphone blocked. Allow the microphone in your browser.",
    noSpeech: "No speech detected. Try again.",
    micError: "Microphone error. Try again.",
    startError: "Could not start the microphone. Try again.",
    notUnderstood: "Calculation not recognised. Try “twelve divided by four”.",
    incomplete: "Incomplete calculation. Try again.",
    done: "Result shown. Ready for the next calculation…",
    installed: "App installed.",
    chromeInstall: "In Chrome: ⋮ menu, then “Install app”.",
    installLabel: "Install app"
  };

  window.CALC_TEXT = T;
  hintEl.dataset.hint = T.hint;
  hintEl.textContent = T.hint;
  document.getElementById("install").lastChild.textContent = " " + T.installLabel;

  /* ---------- Niveau de l'hologramme ---------- */
  let holoLevel = 0;
  let holoTarget = 0;
  let holoRaf = null;

  function holoStep() {
    holoLevel += (holoTarget - holoLevel) * 0.24;
    holoEl.style.setProperty("--level", Math.max(0, holoLevel).toFixed(3));
    holoTarget *= 0.92;
    if (holoLevel > 0.02 || holoTarget > 0.02) {
      holoRaf = requestAnimationFrame(holoStep);
    } else {
      holoRaf = null;
      holoEl.style.setProperty("--level", "0");
    }
  }

  function holoBoost(value) {
    holoTarget = Math.min(1, Math.max(holoTarget, value));
    if (!holoRaf) holoRaf = requestAnimationFrame(holoStep);
  }

  let expr = "";
  let justEval = false;
  let resetTimer = null;

  const pretty = (s) =>
    s.replace(/\*/g, "×").replace(/\//g, "÷").replace(/-/g, "−").replace(/\./g, ",");

  function render() {
    resultEl.textContent = expr === "" ? "0" : pretty(expr);
  }

  function resetAll() {
    clearTimeout(resetTimer);
    expr = "";
    justEval = false;
    historyEl.textContent = "";
    transcriptEl.textContent = "";
    holoEl.classList.remove("live");
    render();
    hintEl.textContent = hintEl.dataset.hint;
    setBadge("idle");
  }

  function appendDigit(d) {
    const tail = (expr.match(/(\d*\.?\d*)$/) || ["", ""])[1];
    if (d === ".") {
      if (tail.includes(".")) return;
      expr += tail === "" ? "0." : ".";
      return;
    }
    if (tail === "0") {
      expr = expr.slice(0, -1) + d;
      return;
    }
    expr += d;
  }

  function press(key) {
    clearTimeout(resetTimer);

    if (/^[0-9]$/.test(key)) {
      if (justEval) { expr = ""; justEval = false; historyEl.textContent = ""; }
      appendDigit(key);
    } else if (key === ".") {
      if (justEval) { expr = "0"; justEval = false; historyEl.textContent = ""; }
      appendDigit(".");
    } else if (key === "ac") {
      resetAll();
      return;
    } else if (key === "del") {
      if (justEval) { expr = ""; justEval = false; }
      else expr = expr.slice(0, -1);
    } else if (key === "%") {
      const tail = (expr.match(/(\d*\.?\d*)$/) || ["", ""])[1];
      if (!tail) return;
      const value = parseFloat(tail) / 100;
      expr = expr.slice(0, expr.length - tail.length) + String(value);
    } else if (key === "neg") {
      const tail = (expr.match(/(\d*\.?\d*)$/) || ["", ""])[1];
      if (!tail) return;
      const before = expr.slice(0, expr.length - tail.length);
      expr = before.endsWith("-") ? before.slice(0, -1) + tail : before + "-" + tail;
    } else if (key === "=") {
      if (justEval) return;
      const value = safeEval(expr);
      if (value === null) {
        resultEl.textContent = "Erreur";
        return;
      }
      historyEl.textContent = pretty(expr) + " =";
      expr = String(value);
      justEval = true;
    } else {
      if (expr === "") {
        if (key === "-") expr = "-";
        else return;
      } else if (/[+\-*/]$/.test(expr)) {
        expr = expr.slice(0, -1) + key;
      } else if (expr.endsWith(".")) {
        expr = expr.slice(0, -1) + key;
      } else {
        expr += key;
      }
      justEval = false;
    }
    render();
  }

  document.querySelectorAll(".key").forEach((btn) => {
    btn.addEventListener("click", () => press(btn.dataset.key));
  });

  function safeEval(expression) {
    if (!expression) return null;
    if (/[^0-9+\-*/().]/.test(expression)) return null;
    if (/[+\-*/.]$/.test(expression)) return null;
    try {
      const value = Function('"use strict";return (' + expression + ')')();
      if (typeof value !== "number" || !isFinite(value)) return null;
      return Math.round(value * 1e10) / 1e10;
    } catch (e) {
      return null;
    }
  }

  /* ---------- Nombres en mots (français + anglais) ---------- */
  const FR_WORDS = {
    zero: 0, un: 1, une: 1, deux: 2, trois: 3, quatre: 4, cinq: 5, six: 6,
    sept: 7, huit: 8, neuf: 9, dix: 10, onze: 11, douze: 12, treize: 13,
    quatorze: 14, quinze: 15, seize: 16, vingt: 20, trente: 30, quarante: 40,
    cinquante: 50, soixante: 60, cent: 100, cents: 100,
    mille: 1000, milliers: 1000, million: 1000000, millions: 1000000
  };

  const EN_WORDS = {
    zero: 0, one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7,
    eight: 8, nine: 9, ten: 10, eleven: 11, twelve: 12, thirteen: 13,
    fourteen: 14, fifteen: 15, sixteen: 16, seventeen: 17, eighteen: 18,
    nineteen: 19, twenty: 20, thirty: 30, forty: 40, fifty: 50, sixty: 60,
    seventy: 70, eighty: 80, ninety: 90, hundred: 100, hundreds: 100,
    thousand: 1000, thousands: 1000, million: 1000000, millions: 1000000
  };

  const WORDS = Object.assign({}, FR_WORDS, EN_WORDS);
  const CONNECTORS = ["et", "and"];

  function parseNumberWords(run) {
    let total = 0, current = 0;
    for (const w of run) {
      const v = WORDS[w];
      if (v === undefined) continue;
      if (v === 1000 || v === 1000000) {
        current = (current || 1) * v;
        total += current;
        current = 0;
      } else if (v === 100) {
        current = (current || 1) * 100;
      } else if (v >= 20 && v % 10 === 0 && current > 0 && current < 10) {
        current *= v;
      } else {
        current += v;
      }
    }
    return total + current;
  }

  function wordsToDigits(s) {
    const isNum = (w) => Object.prototype.hasOwnProperty.call(WORDS, w);
    const tokens = s.split(/\s+/).filter(Boolean);
    const out = [];
    for (let i = 0; i < tokens.length; i++) {
      if (isNum(tokens[i])) {
        const run = [];
        while (i < tokens.length) {
          if (isNum(tokens[i])) { run.push(tokens[i]); i++; }
          else if (CONNECTORS.indexOf(tokens[i]) !== -1 && tokens[i + 1] && isNum(tokens[i + 1])) { i++; }
          else break;
        }
        i--;
        out.push(String(parseNumberWords(run)));
      } else {
        out.push(tokens[i]);
      }
    }
    return out.join(" ");
  }

  function speechToEquation(text) {
    const DASH = "\u0001";
    let s = String(text).toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/[’']/g, " ")
      .replace(/÷/g, " / ").replace(/×/g, " * ")
      .replace(/[−–—]/g, "-");

    s = s.replace(/(\d)\s*-\s*(?=\d)/g, "$1" + DASH);
    s = s.replace(/-/g, " ");
    s = s.split(DASH).join(" - ");

    s = s.replace(/\s+/g, " ").trim();
    s = s.replace(/\bvirgule\b/g, " , ").replace(/\bpoint\b/g, " , ");

    s = s.replace(/\b(egal|egale|egales|egaux|font|fait|resultat|donne|combien|est|ca|equals|equal|is|are|makes|make|what|how|much|result|the)\b/g, " ");

    s = s.replace(/\bdivis(e|er|ee|es)?\s+par\b/g, " / ")
         .replace(/\bdivise\b/g, " / ")
         .replace(/\bdivide[sd]?(\s+by)?\b/g, " / ")
         .replace(/\bover\b/g, " / ")
         .replace(/\bsur\b/g, " / ")
         .replace(/\bmultipli(e|er|ee|es)\s+par\b/g, " * ")
         .replace(/\bmultiplied\s+by\b/g, " * ")
         .replace(/\bmultiply\s+by\b/g, " * ")
         .replace(/\btimes\b/g, " * ")
         .replace(/\bfois\b/g, " * ")
         .replace(/\bpour\s*cent\b/g, " % ")
         .replace(/\bpourcent\b/g, " % ")
         .replace(/\bplus\b/g, " + ")
         .replace(/\bmoins\b/g, " - ")
         .replace(/\bminus\b/g, " - ")
         .replace(/(^|[^a-z])x(?=[^a-z]|$)/g, "$1 * ");

    s = wordsToDigits(s);

    s = s.replace(/\s*,\s*/g, ".");
    s = s.replace(/[^0-9+\-*/%.()]/g, "");
    s = s.replace(/\s+/g, "");
    return s;
  }

  /* ---------- Web Speech API ---------- */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let listening = false;
  let finalText = "";

  function setBadge(state) {
    badgeEl.className = "badge";
    if (state === "listen") { badgeEl.classList.add("on", "listen"); badgeTextEl.textContent = T.listen; }
    else if (state === "on") { badgeEl.classList.add("on"); badgeTextEl.textContent = T.active; }
    else { badgeTextEl.textContent = T.idle; }
  }

  function setListening(on) {
    listening = on;
    micEl.classList.toggle("listening", on);
    holoEl.classList.toggle("live", on);
    if (on) holoBoost(0.62);
    micEl.setAttribute("aria-pressed", on ? "true" : "false");
    setBadge(on ? "listen" : "idle");
    hintEl.textContent = on ? T.listening : hintEl.dataset.hint;
  }

  if (!SR) {
    micEl.addEventListener("click", () => {
      hintEl.textContent = T.unsupported;
      holoBoost(0.5);
      setTimeout(function () { holoBoost(0.1); }, 260);
    });
  } else {
    recognition = new SR();
    recognition.lang = REC_LANG;
    recognition.interimResults = true;
    recognition.continuous = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      finalText = "";
      transcriptEl.textContent = "";
      setListening(true);
    };

    recognition.onresult = (event) => {
      let interim = "";
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const chunk = event.results[i][0].transcript;
        if (event.results[i].isFinal) finalText += chunk + " ";
        else interim += chunk;
      }
      transcriptEl.textContent = (finalText + interim).trim();
      holoBoost(0.42 + Math.min(0.55, (finalText + interim).length / 36));
    };

    recognition.onspeechend = () => {
      holoBoost(0.25);
    };

    recognition.onerror = (event) => {
      setListening(false);
      if (event.error === "not-allowed" || event.error === "service-not-allowed") {
        hintEl.textContent = T.denied;
      } else if (event.error === "no-speech") {
        hintEl.textContent = T.noSpeech;
      } else {
        hintEl.textContent = T.micError;
      }
    };

    recognition.onend = () => {
      setListening(false);
      const spoken = finalText.trim();
      if (spoken) handleVoice(spoken);
    };

    micEl.addEventListener("click", () => {
      if (listening) { recognition.stop(); return; }
      clearTimeout(resetTimer);
      resetAll();
      hintEl.textContent = T.listening;
      recognition.lang = REC_LANG;
      try { recognition.start(); }
      catch (e) { hintEl.textContent = T.startError; }
    });
  }

  function handleVoice(text) {
    transcriptEl.textContent = "« " + text + " »";
    const equation = speechToEquation(text);

    if (!equation) {
      hintEl.textContent = T.notUnderstood;
      return;
    }

    const value = safeEval(equation.replace(/%/g, "/100"));
    if (value === null) {
      historyEl.textContent = pretty(equation);
      hintEl.textContent = T.incomplete;
      return;
    }

    historyEl.textContent = pretty(equation) + " =";
    expr = String(value);
    justEval = true;
    render();
    holoBoost(1);
    hintEl.textContent = T.done;
    setBadge("on");
    resetTimer = setTimeout(resetAll, 2800);
  }

  render();
  setBadge("idle");
})();
</script>

<script>
/* Installation en tant qu'application (Chrome) */
(function () {
  "use strict";

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }

  const installBtn = document.getElementById("install");
  const hintEl = document.getElementById("hint");
  const T = window.CALC_TEXT || { installed: "Application installée.", chromeInstall: "Dans Chrome : menu ⋮ puis « Installer l’application »." };
  let deferredPrompt = null;

  const baseHint = function () { return hintEl.dataset.hint || hintEl.textContent; };
  const isStandalone = window.matchMedia("(display-mode: standalone)").matches;
  if (isStandalone) installBtn.hidden = true;

  window.addEventListener("beforeinstallprompt", function (event) {
    event.preventDefault();
    deferredPrompt = event;
    installBtn.hidden = false;
  });

  window.addEventListener("appinstalled", function () {
    deferredPrompt = null;
    installBtn.hidden = true;
    hintEl.textContent = T.installed;
    setTimeout(function () { hintEl.textContent = baseHint(); }, 2800);
  });

  installBtn.addEventListener("click", async function () {
    if (!deferredPrompt) {
      hintEl.textContent = T.chromeInstall;
      setTimeout(function () { hintEl.textContent = baseHint(); }, 5000);
      return;
    }
    deferredPrompt.prompt();
    try {
      const choice = await deferredPrompt.userChoice;
      if (choice && choice.outcome === "accepted") installBtn.hidden = true;
    } catch (e) {}
    deferredPrompt = null;
  });
})();
</script>

<script>
/* Pied de page : don */
(function () {
  "use strict";

  const dialog = document.getElementById("donateDialog");
  const openBtn = document.getElementById("donateBtn");
  const closeBtn = document.getElementById("closeDonate");
  const copyBtn = document.getElementById("copyAddr");
  const addrEl = document.getElementById("donateAddr");
  if (!dialog || !openBtn || !closeBtn || !copyBtn || !addrEl) return;

  const ADDRESS = addrEl.textContent.trim();
  const COPY_LABEL = copyBtn.textContent;

  openBtn.addEventListener("click", function () {
    if (typeof dialog.showModal === "function") dialog.showModal();
    else dialog.setAttribute("open", "");
  });

  closeBtn.addEventListener("click", function () { dialog.close(); });
  dialog.addEventListener("click", function (event) {
    if (event.target === dialog) dialog.close();
  });

  copyBtn.addEventListener("click", async function () {
    try {
      await navigator.clipboard.writeText(ADDRESS);
      copyBtn.textContent = "Copié !";
    } catch (e) {
      copyBtn.textContent = "Copiez le texte";
    }
    setTimeout(function () { copyBtn.textContent = COPY_LABEL; }, 2000);
  });
})();
</script>
